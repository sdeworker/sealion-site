      <h1>第三十三届 CHINAPLAS 国际橡塑展</h1>
      <div class="nv-meta"><time datetime="2019-05-30">2019-05-30</time></div>
      <div class="nv-cover"><img src="/assets/news/expo-33-booth.jpg" alt="第三十三届 CHINAPLAS 国际橡塑展" width="400" height="280"></div>
      <div class="nv-body">
        <p>CHINAPLAS 国际橡塑展伴随着中国塑料及橡胶行业成长逾33年，至今已发展成为亚洲最具规模之橡塑业展会，并对中国橡塑业的发展产生了积极的推动作用。目前，「CHINAPLAS 国际橡塑展」不单是亚洲最大型的塑料及橡胶业展览会，业内人士更公认其影响力仅次于全球第一大橡塑展的德国「K展」，成为橡塑业的世界第二大展会。</p>
